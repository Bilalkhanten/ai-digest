name: Feature request
description: Suggest an improvement or a new connector, signal or page
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
