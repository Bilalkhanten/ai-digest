name: Weekly roll-up

on:
  schedule:
    - cron: "23 18 * * 0"   # Sundays 18:23 UTC, after that day's digest
  workflow_dispatch:

permissions: {}

# Its own queue: a stuck weekly run must never be able to block the daily run. The two are
# hours apart; the rebase before pushing covers the unlikely case of an overlap.
concurrency:
  group: weekly-rollup
  cancel-in-progress: false

env:
  ALERT_TITLE: "Weekly roll-up failed"

jobs:
  rollup:
    name: Write the weekly page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run offline test suite
        run: python3 -m unittest discover -s tests

      - name: Build the roll-up
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}   # read public star counts for "biggest gainers"
        run: python3 scripts/weekly_rollup.py --force   # regenerate; unchanged pages are not committed

      - name: Commit the roll-up
        if: steps.run.outputs.written != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          WRITTEN: ${{ steps.run.outputs.written }}
        run: |
          owner_id="$(gh api "users/$OWNER" --jq .id)"
          git config user.name "$OWNER"
          git config user.email "${owner_id}+${OWNER}@users.noreply.github.com"
          git add digest/weekly
          if git diff --cached --quiet; then
            echo "Roll-up unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "weekly: ${WRITTEN%.md}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Open or update issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/alert_issue.sh open "$ALERT_TITLE" "@$OWNER The weekly roll-up failed: $RUN_URL"

      - name: Close issue if healthy again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/alert_issue.sh close "$ALERT_TITLE" "Resolved: the roll-up succeeded ($RUN_URL)."
