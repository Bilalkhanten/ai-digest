name: Daily pipeline run

on:
  schedule:
    - cron: "17 7 * * *"    # 07:17 UTC daily
    - cron: "43 13 * * *"   # backup slots: GitHub often delays or skips scheduled runs, and the
    - cron: "29 19 * * *"   # job does nothing if today's digest already exists, so extras are free
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pick a repo and print it, but don't fork or commit"
        type: boolean
        default: false

# Each job asks only for what it needs.
permissions: {}

concurrency:
  group: daily-fork
  cancel-in-progress: false

env:
  ALERT_TITLE: "Daily pipeline run failed"

jobs:
  # Deploy gate: nothing is forked or committed unless the tests pass.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run offline test suite
        run: python3 -m unittest discover -s tests

  fork:
    name: Discover, score, fork and commit
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      picked: ${{ steps.run.outputs.picked }}
      fork_url: ${{ steps.run.outputs.fork_url }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover, score, fork and write the report
        id: run
        env:
          GH_TOKEN: ${{ secrets.FORK_PAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 scripts/daily_fork.py

      - name: Commit the report
        id: commit
        if: steps.run.outputs.picked != ''
        env:
          PICKED: ${{ steps.run.outputs.picked }}
          COMMIT_NAME: ${{ steps.run.outputs.commit_name }}
          COMMIT_EMAIL: ${{ steps.run.outputs.commit_email }}
        run: |
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git add digest forked.json INDEX.md
          git commit -m "digest: $PICKED"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Success notice: an @mention on one running issue emails you (and pushes to the
  # GitHub mobile app). Only runs when a real commit was pushed, not on dry runs.
  notify:
    name: Notify run complete
    needs: fork
    if: needs.fork.outputs.picked != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Post to the run log issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PICKED: ${{ needs.fork.outputs.picked }}
          FORK_URL: ${{ needs.fork.outputs.fork_url }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.fork.outputs.sha }}
        run: |
          fork="${FORK_URL:-none today (digest only)}"
          ./scripts/alert_issue.sh open "Pipeline run log" \
            "@$OWNER Pipeline run complete: processed **$PICKED**.

          - Commit: $COMMIT_URL
          - Fork: $fork

          The report is committed to the repository."

  # Optional: publish the digest as a small website with an RSS feed. Off until you enable
  # GitHub Pages (Settings > Pages > Source: GitHub Actions) and set the repository
  # variable ENABLE_PAGES to true. See the README.
  pages:
    name: Publish site
    needs: fork
    if: needs.fork.outputs.picked != '' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.fork.outputs.sha }}
      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_site.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # Failure alert: opens (or comments on) one GitHub issue per outage.
  alert:
    name: Open failure issue
    needs: [verify, fork]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/alert_issue.sh open "$ALERT_TITLE" \
            "@$OWNER The daily run failed: $RUN_URL

          Common causes: the FORK_PAT token expired or was revoked (see the Token health workflow), GitHub API outage, or a failing test."

  # Self-heal: closes the issue once a run succeeds again.
  resolve:
    name: Close failure issue
    needs: [verify, fork]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Close issue if one is open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./scripts/alert_issue.sh close "$ALERT_TITLE" "Resolved: a later run succeeded ($RUN_URL)."
