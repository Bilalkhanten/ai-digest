<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="t d">
  <title id="t">Repo digest</title>
  <desc id="d">One popular open-source repository a day: AI, Kubernetes, DevOps, SRE, Docker and monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1320"/>
      <stop offset="0.55" stop-color="#14304f"/>
      <stop offset="1" stop-color="#1d5a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="240" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <circle cx="900" cy="30" r="150" fill="#58a6ff" opacity="0.08"/>
    <circle cx="960" cy="230" r="110" fill="#3fb950" opacity="0.09"/>
    <circle cx="70" cy="250" r="90" fill="#ffffff" opacity="0.04"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.07">
      <path d="M0 60 H1000 M0 120 H1000 M0 180 H1000"/>
      <path d="M250 0 V240 M500 0 V240 M750 0 V240"/>
    </g>
    <rect x="64" y="58" width="6" height="64" rx="3" fill="url(#accent)"/>
    <text x="90" y="104" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Repo digest</text>
    <text x="92" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#b8d4f0">One popular open-source repo a day, forked and summarised automatically.</text>
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6f0fb">
      <g transform="translate(92 170)"><rect width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/><text x="52" y="20" text-anchor="middle">kubernetes</text></g>
      <g transform="translate(206 170)"><rect width="58" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/><text x="29" y="20" text-anchor="middle">llm</text></g>
      <g transform="translate(274 170)"><rect width="58" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/><text x="29" y="20" text-anchor="middle">sre</text></g>
      <g transform="translate(342 170)"><rect width="82" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/><text x="41" y="20" text-anchor="middle">docker</text></g>
      <g transform="translate(434 170)"><rect width="116" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/><text x="58" y="20" text-anchor="middle">observability</text></g>
      <g transform="translate(560 170)"><rect width="86" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/><text x="43" y="20" text-anchor="middle">gitops</text></g>
    </g>
  </g>
</svg>
